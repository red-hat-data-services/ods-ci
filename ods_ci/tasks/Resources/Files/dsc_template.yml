apiVersion: datasciencecluster.opendatahub.io/v3
kind: DataScienceCluster
metadata:
  name: <dsc_name>
  labels:
      app.kubernetes.io/name: datasciencecluster
spec:
  components:
    dashboard:
      standard:
        managementState: <dashboard_value>
    aipipelines:
      managementState: <aipipelines_value>
    kserve:
      managementState: <kserve_value>
    aigateway:
      managementState: <aigateway_value>
      modelsAsAService:
        managementState: <modelsasservice_value>
      batchGateway:
        managementState: <batchgateway_value>
    kueue:
      managementState: <kueue_value>
    ray:
      managementState: <ray_value>
    trainer:
      managementState: <trainer_value>
    trustyai:
      managementState: <trustyai_value>
    workbenches:
      managementState: <workbenches_value>
      workbenchNamespace: <workbenches_namespace>
    aiHub:
      managementState: <modelregistry_value>
      instancesNamespace: <modelregistry_namespace>
    data:
      featureStore:
        managementState: <feastoperator_value>
    ogx:
      managementState: <ogx_value>
    mlflowoperator:
      managementState: <mlflowoperator_value>
    sparkoperator:
      managementState: <sparkoperator_value>
    mcplifecycleoperator:
      managementState: <mcplifecycleoperator_value>
